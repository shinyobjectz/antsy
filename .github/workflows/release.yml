name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    strategy:
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-latest }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          rustup target add ${{ matrix.target }}
          if [[ "${{ matrix.target }}" == *linux-musl ]]; then cargo install cross --locked; fi
      - name: Build
        run: |
          if [[ "${{ matrix.target }}" == *linux-musl ]]; then
            cross build --release --locked --target ${{ matrix.target }}
          else
            cargo build --release --locked --target ${{ matrix.target }}
          fi
          tar -czf antsy-${{ matrix.target }}.tar.gz -C target/${{ matrix.target }}/release antsy
      - uses: softprops/action-gh-release@v2
        with:
          files: antsy-${{ matrix.target }}.tar.gz
