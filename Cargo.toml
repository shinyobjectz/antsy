[package]
name = "antsy"
version = "0.3.0"
edition = "2021"
license = "Apache-2.0"
description = "Fail-fast supervisor, failure-mode watcher and OTLP sink for coding agents"
repository = "https://github.com/shinyobjectz/antsy"
readme = "README.md"
keywords = ["claude-code", "supervisor", "opentelemetry", "agents", "fail-fast"]
categories = ["command-line-utilities", "development-tools"]
rust-version = "1.80"

# Four small, pure-Rust dependencies keep a cold build short and light on memory.
[dependencies]
libc = "0.2"
miniz_oxide = { version = "0.8", default-features = false, features = ["with-alloc"] }
regex-lite = "0.1"
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
panic = "abort"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 1
